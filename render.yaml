services:
  # Free-tier FastAPI Backend Web Service
  - type: web
    name: inner-awakening-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: USE_SQLITE
        value: "true"
      - key: SQLITE_DB_PATH
        value: "./inner_awakening.db"
      - key: CORS_ORIGINS
        value: "*"
