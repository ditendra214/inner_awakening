[build]
  publish = "dist"
  command = "npm run build"

# SPA routing fallback for Netlify Free tier
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets (GLB models, textures, images) to minimize bandwidth
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
